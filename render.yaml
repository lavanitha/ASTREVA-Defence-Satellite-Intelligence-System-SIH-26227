services:
  - type: web
    name: astreva-backend
    env: python
    region: oregon
    plan: standard
    autoDeployTrigger: commit
    buildCommand: "bash scripts/render_build.sh"
    startCommand: "bash scripts/render_start.sh"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: ASTREVA_DATASET_DIR
        value: /var/data/SIH-2026/Dataset
      - key: ASTREVA_CODE_DIR
        value: /opt/render/project/src/runtime/SIH-2026/CODE
      - key: ASTREVA_DATA_VERSION
        value: sih2026-v1
      - key: HF_HOME
        value: /var/data/huggingface
      - key: TORCH_HOME
        value: /var/data/torch
    disk:
      name: astreva-runtime-data
      mountPath: /var/data
      sizeGB: 3
